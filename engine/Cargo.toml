[workspace]
# default-members 只含 core：本机（可能没有 MSVC linker）执行 `cargo test`
# 时只构建 rlib，不会去链接 ffi 的 cdylib —— 这是本地 100% 可跑的关键（架构 §11.1-R5）。
members = ["core", "ffi"]
default-members = ["core"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/planover/Calculator-planover"

[workspace.dependencies]
serde = { version = "=1.0.210", default-features = false, features = ["derive"] }
serde_json = "=1.0.128"
libc = "=0.2.159"
calculator_core = { path = "core" }

[profile.release]
opt-level = "z"     # 移动端包体优先
lto = true
panic = "abort"     # panic 不允许跨越 FFI；release 下直接 abort 更安全
codegen-units = 1
strip = true
