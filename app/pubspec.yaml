name: calculator_planover
description: "Calculator-planover — Android 科学计算器（Rust 内核 + Flutter UI）"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # FFI 直连 Rust core（不使用 flutter_rust_bridge，见 engine/ffi）
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
