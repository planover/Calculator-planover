# 路径必须是 flutter.yaml（官方模板），不是 analysis_options.yaml ——
# 后者不存在，会让 `flutter analyze` 报 include_file_not_found 并判定失败。
include: package:flutter_lints/flutter.yaml

linter:
  rules:
    prefer_const_constructors: true
    always_declare_return_types: true
    avoid_print: false

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
