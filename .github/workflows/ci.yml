name: CI

on:
  push:
    branches: ["main", "master", "**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-core:
    name: Rust core tests (calculator_core)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain (pinned by engine/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"
      - name: Build core
        run: cargo build -p calculator_core
      - name: Test (core only — default-members=[core] 不链接 cdylib)
        # 只测 rlib，保证无 Android / FFI 依赖也能 100% 跑绿
        run: cargo test -p calculator_core

  flutter-shell:
    name: Flutter analyze + test (Dart side)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 架构 §依赖清单锁定 Flutter 3.24.5（Dart 3.5.4），杜绝版本漂移
          flutter-version: '3.24.5'
          cache: true
      - name: Resolve deps
        run: flutter pub get
      - name: Analyze
        # --no-fatal-infos：风格类提示不算失败，只拦 error/warning
        run: flutter analyze --no-fatal-infos
      - name: Test
        # 用例一律注入 FakeEngine / MemoryHistoryRepository，不加载 .so（架构风险 R3）
        run: flutter test
