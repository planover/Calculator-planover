name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # secrets 无法在 if: 条件中直接引用（GitHub 限制：steps.if 不提供 secrets 上下文，
  # 直接引用会解析为空串导致分支恒不成立、或报 Unrecognized named-value）。
  # 顶层 env 允许引用 secrets，故在此折算成布尔标志，供各 job 的步骤 if 使用。
  # fork / PR 无密钥时该值为 'false'，签名步骤被跳过，由 build.gradle.kts 回退 debug 签名。
  HAS_RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build-rust-android:
    name: Build Rust cdylib for Android
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          # 与 engine/rust-toolchain.toml 锁定的 channel="1.83.0" 保持一致。
          # 若只装 stable，实际编译会被 rust-toolchain.toml 切到 1.83.0，
          # 而 Android target 只装到了 stable 上 → E0463 can't find crate for `core`。
          toolchain: 1.83.0
          targets: ${{ matrix.target }}
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.1.2
      - name: Build cdylib
        run: |
          cargo ndk -t ${{ matrix.target }} \
            -o ../app/android/app/src/main/jniLibs \
            build -p calculator_ffi --release
      - name: Upload so
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs-${{ matrix.target }}
          path: app/android/app/src/main/jniLibs

  build-apk:
    name: Build Flutter APK
    needs: build-rust-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # 架构 §依赖清单锁定 Flutter 3.24.5（Dart 3.5.4），与 ci.yml 一致；
          # generate_android_shell.py 生成的 gradle 壳必须与构建版本一致
          flutter-version: '3.24.5'
          cache: true
      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate Android shell (gradle wrapper)
        # gradle-wrapper.jar 是二进制、不入库：用与锁定 Flutter 版本匹配的
        # `flutter create` 现场生成 gradlew / gradle-wrapper.jar 并拷回 app/android/
        run: python3 tools/generate_android_shell.py
      - name: Assemble jniLibs
        # 打入 .so + 落包信息（applicationId/minSdk/targetSdk/label）+ grep 断言
        run: python3 tools/patch_android.py --artifacts artifacts
      - name: Setup release signing (from secrets)
        # keystore 与密码经 4 个仓库 Secret 注入；Secret 缺失时跳过（HAS_RELEASE_KEYSTORE
        # 为 false），由 build.gradle.kts 回退到 debug 签名（fork / PR 场景仍可构建）。
        # 注意：if 不能直接引用 secrets，故用顶层 env 折算的布尔标志。
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/app/planover-release.p12
          {
            echo "storeFile=planover-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > app/android/key.properties
          test -s app/android/app/planover-release.p12
          echo "release keystore 已就绪（$(wc -c < app/android/app/planover-release.p12) 字节）"
      - name: Build APK
        working-directory: app
        run: flutter pub get && flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  verify-package:
    name: Verify APK package info + ABIs
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release.apk
          path: apk
      - name: Assert three ABIs present (unzip fallback)
        run: |
          set -e
          APK=apk/app-release.apk
          unzip -l "$APK"
          for so in \
            lib/arm64-v8a/libcalculator_ffi.so \
            lib/armeabi-v7a/libcalculator_ffi.so \
            lib/x86_64/libcalculator_ffi.so; do
            if unzip -l "$APK" | grep -q "$so"; then
              echo "OK  $so"
            else
              echo "缺少原生库：$so" >&2
              exit 1
            fi
          done
      - name: Assert package info via aapt
        run: |
          set -e
          export PATH="$PATH:${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          yes | sdkmanager "build-tools;34.0.0" > /dev/null || true
          APK=apk/app-release.apk
          BADGING="$(aapt dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='com.planover.calculatorplanover'" \
            || { echo "applicationId 不符" >&2; exit 1; }
          echo "$BADGING" | grep -q "sdkVersion:'26'" \
            || { echo "minSdk 不符" >&2; exit 1; }
          echo "$BADGING" | grep -q "targetSdkVersion:'34'" \
            || { echo "targetSdk 不符" >&2; exit 1; }
          echo "$BADGING" | grep -q "application-label:'Calculator-planover'" \
            || { echo "label 不符" >&2; exit 1; }
          echo "包信息断言全部通过"
      - name: Assert APK is signed with release key
        # 本方案核心验收点：证明 debug 签名已被替换为 release 密钥。
        # 置于 aapt 断言之后——该步已装好 build-tools;34.0.0，apksigner 可直接使用。
        # 无密钥环境（HAS_RELEASE_KEYSTORE=false）跳过：此时 APK 本就是 debug 签名。
        if: ${{ env.HAS_RELEASE_KEYSTORE == 'true' }}
        run: |
          set -euo pipefail
          APK=apk/app-release.apk
          BK="${ANDROID_SDK_ROOT}/build-tools/34.0.0"
          CERTS="$("$BK/apksigner" verify --print-certs "$APK")"
          echo "$CERTS"
          # 签名者证书 DN 必须是我们生成的 release 证书（CN=Calculator-planover）。
          echo "$CERTS" | grep -q "CN=Calculator-planover" \
            || { echo "APK 未使用 release 证书签名" >&2; exit 1; }
          echo "release 签名断言通过"
